<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --ink:#1D1F20; --blue:#3B87F2; }
  html,body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#FFFFFF; font-family:'Inter Display','Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .scene { position:absolute; inset:0; }
  .title { position:absolute; left:80px; right:80px; top:300px; height:260px; display:flex; flex-wrap:wrap; align-content:center; justify-content:center;
           column-gap:22px; font-weight:700; font-size:92px; line-height:1.02; letter-spacing:-0.035em; color:var(--ink); text-align:center; }
  .title span { display:inline-block; }
  .title .k { color:var(--blue); }
  svg.art { position:absolute; left:0; top:620px; width:1080px; height:640px; overflow:visible; transform-origin:540px 420px; }
  #sub { position:absolute; left:110px; right:110px; top:1335px; height:160px; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; text-align:center;
         font-weight:500; font-size:48px; line-height:1.22; letter-spacing:-0.015em; column-gap:13px; }
  svg text { font-family:'Inter Display','Inter',sans-serif; }
</style></head>
<body>
<div id="stage"></div>
<div id="sub"></div>
<script>
const INK = '#1D1F20', BLUE = '#3B87F2', TINT = '#EEEFF0', MUTE = 'rgba(29,31,32,0.38)';
const S = (w = 6, c = INK) => `fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const T = (x, y, s, txt, o = {}) => `<text x="${x}" y="${y}" font-size="${s}" font-weight="${o.w || 600}" fill="${o.c || INK}" text-anchor="${o.a || 'middle'}" dominant-baseline="central" letter-spacing="${o.ls ?? -0.5}">${txt}</text>`;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const io = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const pop = p => p <= 0 ? 0 : p < 0.6 ? lerp(0.86, 1.04, io(p / 0.6)) : lerp(1.04, 1, io((p - 0.6) / 0.4));

// ================= props =================
// iMessage-style bubble; width measured at setup. side: 'out' (blue, tail right) | 'in' (grey, tail left) | 'ink'
function bub(x, y, txt, o = {}) {
  const s = o.size || 34, side = o.side || 'in', lines = txt.split('\n'), lh = s * 1.22, h = lines.length * lh + 34;
  const fill = side === 'out' ? BLUE : side === 'ink' ? INK : TINT, col = side === 'in' ? INK : '#fff';
  const tx = lines.map((l, i) => T(0, y + 17 + lh * (i + 0.5), s, l, { a: 'start', c: col, w: 500 })).join('');
  return `<g data-bub="${o.anchor || (side === 'in' ? 'l' : 'r')}" data-x="${x}" data-y="${y}" data-h="${h}" data-side="${side}"><path fill="${fill}"/>${tx}</g>`;
}
function bubPath(x, y, w, h, side) {
  const r = Math.min(28, h / 2), b = y + h;
  let d = `M${x + r} ${y} H${x + w - r} Q${x + w} ${y} ${x + w} ${y + r} V${b - r} Q${x + w} ${b} ${x + w - r} ${b} H${x + r} Q${x} ${b} ${x} ${b - r} V${y + r} Q${x} ${y} ${x + r} ${y} Z`;
  if (side === 'in') d += `M${x + 4} ${b - 22} Q${x - 2} ${b + 2} ${x - 14} ${b + 6} Q${x + 10} ${b + 6} ${x + 24} ${b - 4} Z`;
  else d += `M${x + w - 4} ${b - 22} Q${x + w + 2} ${b + 2} ${x + w + 14} ${b + 6} Q${x + w - 10} ${b + 6} ${x + w - 24} ${b - 4} Z`;
  return d;
}
// small pill label (centered)
const pill = (cx, cy, txt, o = {}) => `<g data-pill="1" data-x="${cx}" data-y="${cy}" data-s="${o.size || 30}"><rect fill="${o.fill ? BLUE : '#fff'}" ${o.fill ? '' : S(4)}/>${T(cx, cy, o.size || 30, txt, { c: o.fill ? '#fff' : INK, w: 600 })}</g>`;
const star = (x, y, r, c = BLUE) => `<path d="M${x} ${y - r} Q${x + r * 0.18} ${y - r * 0.18} ${x + r} ${y} Q${x + r * 0.18} ${y + r * 0.18} ${x} ${y + r} Q${x - r * 0.18} ${y + r * 0.18} ${x - r} ${y} Q${x - r * 0.18} ${y - r * 0.18} ${x} ${y - r} Z" fill="${c}"/>`;
const heartP = (x, y, s, c = BLUE) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 14 C -26 -3, -19 -27, 0 -13 C 19 -27, 26 -3, 0 14 Z" fill="${c}"/>`;
const check = (cx, cy, r, c = BLUE, w = 8) => `<path d="M${cx - r} ${cy} L${cx - r * 0.3} ${cy + r * 0.7} L${cx + r} ${cy - r * 0.7}" ${S(w, c)}/>`;
const clockIcon = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${S(6)}/><path class="ch" d="M${x} ${y} V${y - r * 0.55}" ${S(6)}/><path class="cm" d="M${x} ${y} H${x + r * 0.4}" ${S(6, BLUE)}/>`;
const card = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="30" fill="#fff" ${S(5)}/>`;
const thought = (x, y, w, h, dir = -1) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="#fff" ${S(5)}/><circle cx="${x + w / 2 + dir * w * 0.28}" cy="${y + h + 22}" r="11" fill="#fff" ${S(5)}/><circle cx="${x + w / 2 + dir * w * 0.38}" cy="${y + h + 46}" r="6" fill="#fff" ${S(4)}/>`;

// ================= character rig =================
// origin = between the feet on the ground. head centre (0,-238), r 78.
const SH = [[-30, -152], [30, -152]], HP = [[-19, -74], [19, -74]];
const POSES = {
  stand:    { h: [[-66, -96], [66, -96]],    f: [[-24, 0], [24, 0]], b: [1, -1] },
  wave:     { h: [[-50, -86], [100, -236]],  f: [[-24, 0], [24, 0]], b: [1, 1] },
  cheer:    { h: [[-92, -262], [92, -262]],  f: [[-30, 0], [30, 0]], b: [-1, 1] },
  facepalm: { h: [[-50, -86], [12, -250]],   f: [[-24, 0], [24, 0]], b: [1, 1] },
  think:    { h: [[16, -118], [20, -186]],   f: [[-24, 0], [24, 0]], b: [-1, 1] },
  shrug:    { h: [[-104, -168], [104, -168]], f: [[-24, 0], [24, 0]], b: [1, -1] },
  point:    { h: [[-50, -86], [140, -190]],  f: [[-24, 0], [24, 0]], b: [1, 1] },
  pointL:   { h: [[-140, -190], [50, -86]],  f: [[-24, 0], [24, 0]], b: [-1, -1] },
  phone:    { h: [[-26, -96], [26, -102]],  f: [[-24, 0], [24, 0]], b: [-1, 1], prop: 'phone' },
  selfie:   { h: [[-50, -86], [70, -330]],   f: [[-24, 0], [24, 0]], b: [1, 1], prop: 'phoneHigh' },
  cheeks:   { h: [[-62, -222], [62, -222]],  f: [[-24, 0], [24, 0]], b: [-1, 1] },
  panic:    { h: [[-66, -300], [66, -300]],  f: [[-34, 0], [34, 0]], b: [-1, 1] },
  hug:      { h: [[34, -124], [-34, -128]],  f: [[-16, 0], [16, 0]], b: [-1, 1] },
  sleep:    { h: [[-64, -206], [-40, -196]], f: [[-24, 0], [24, 0]], b: [-1, -1] },
  card:     { h: [[-50, -86], [118, -150]],  f: [[-24, 0], [24, 0]], b: [1, 1], prop: 'card' },
  walk:     { h: [[-30, -92], [62, -108]],   f: [[-40, 0], [30, -8]], b: [1, -1] },
};
const FACES = {
  neutral: { eyes: 'dot', mouth: 'M-10 30 Q0 37 10 30' },
  happy:   { eyes: 'arc', mouth: 'M-17 24 Q0 50 17 24 Z', mfill: 1, blush: 1 },
  laugh:   { eyes: 'xx', mouth: 'M-22 22 Q0 58 22 22 Z', mfill: 1, blush: 1 },
  smile:   { eyes: 'dot', mouth: 'M-14 27 Q0 41 14 27', blush: 1 },
  shock:   { eyes: 'big', mouth: 'M-9 26 Q-9 22 0 22 Q9 22 9 26 V44 Q9 50 0 50 Q-9 50 -9 44 Z', mfill: 1 },
  worried: { eyes: 'dot', brows: ['M-40 -18 L-16 -26', 'M16 -26 L40 -18'], mouth: 'M-14 36 Q-7 30 0 35 Q7 40 14 34' },
  sad:     { eyes: 'dot', brows: ['M-40 -16 L-16 -26', 'M16 -26 L40 -16'], mouth: 'M-12 38 Q0 28 12 38' },
  tired:   { eyes: 'half', mouth: 'M-8 34 H8' },
  sleep:   { eyes: 'closed', mouth: 'M-8 30 Q0 36 8 30', blush: 1 },
  smug:    { eyes: 'smug', mouth: 'M-12 30 Q4 38 16 26' },
  shy:     { eyes: 'arc', mouth: 'M-8 32 Q0 37 8 32', blush: 1 },
  annoyed: { eyes: 'half', brows: ['M-40 -22 L-16 -16', 'M16 -16 L40 -22'], mouth: 'M-12 34 H12' },
};
function eyesSvg(kind) {
  const L = -27, R = 27, y = 6;
  switch (kind) {
    case 'arc': return `<path d="M${L - 11} ${y + 4} Q${L} ${y - 9} ${L + 11} ${y + 4} M${R - 11} ${y + 4} Q${R} ${y - 9} ${R + 11} ${y + 4}" ${S(6)}/>`;
    case 'xx': return `<path d="M${L - 10} ${y - 8} L${L + 8} ${y} L${L - 10} ${y + 8} M${R + 10} ${y - 8} L${R - 8} ${y} L${R + 10} ${y + 8}" ${S(6)}/>`;
    case 'big': return `<circle cx="${L}" cy="${y}" r="13" fill="#fff" ${S(5)}/><circle cx="${R}" cy="${y}" r="13" fill="#fff" ${S(5)}/><circle cx="${L}" cy="${y}" r="4.5" fill="${INK}"/><circle cx="${R}" cy="${y}" r="4.5" fill="${INK}"/>`;
    case 'half': return `<path d="M${L - 11} ${y - 2} H${L + 11} M${R - 11} ${y - 2} H${R + 11}" ${S(5)}/><circle cx="${L}" cy="${y + 4}" r="5.5" fill="${INK}"/><circle cx="${R}" cy="${y + 4}" r="5.5" fill="${INK}"/>`;
    case 'closed': return `<path d="M${L - 10} ${y} Q${L} ${y + 9} ${L + 10} ${y} M${R - 10} ${y} Q${R} ${y + 9} ${R + 10} ${y}" ${S(6)}/>`;
    case 'smug': return `<path d="M${L - 11} ${y} Q${L} ${y - 6} ${L + 11} ${y} M${R - 11} ${y} Q${R} ${y - 6} ${R + 11} ${y}" ${S(6)}/><circle cx="${L + 2}" cy="${y + 5}" r="5" fill="${INK}"/><circle cx="${R + 2}" cy="${y + 5}" r="5" fill="${INK}"/>`;
    default: return `<g class="blink"><ellipse cx="${L}" cy="${y}" rx="7.5" ry="9" fill="${INK}"/><ellipse cx="${R}" cy="${y}" rx="7.5" ry="9" fill="${INK}"/></g>`;
  }
}
const MARKS = {
  sweat: `<path d="M84 -300 Q74 -282 74 -272 A10 10 0 0 0 94 -272 Q94 -282 84 -300 Z" fill="${BLUE}"/>`,
  bang: `<path d="M100 -330 L94 -296 M122 -318 L108 -290" ${S(6)}/><circle cx="91" cy="-280" r="4" fill="${INK}"/>`,
  q: T(104, -318, 58, '?', { w: 700 }),
  qq: T(-108, -306, 48, '?', { w: 700 }) + T(108, -324, 58, '?', { w: 700 }),
  spark: star(-112, -300, 16) + star(118, -270, 11) + star(96, -334, 8, INK),
  hearts: heartP(-104, -300, 1.1) + heartP(110, -320, 0.8),
  zzz: T(96, -318, 30, 'z', { w: 700 }) + T(124, -344, 38, 'z', { w: 700 }) + T(156, -376, 46, 'z', { w: 700, c: BLUE }),
  spiral: `<path d="M-108 -300 a8 8 0 1 1 8 8 a14 14 0 1 1 -14 -14" ${S(4)}/><path d="M112 -318 a7 7 0 1 1 7 7 a12 12 0 1 1 -12 -12" ${S(4)}/>`,
  glow: `<path d="M-40 -200 l-26 -10 M-36 -176 l-30 4 M40 -200 l26 -10" ${S(4, BLUE)}/>`,
  speed: `<path d="M-120 -170 H-160 M-116 -130 H-170 M-122 -90 H-152" ${S(5, MUTE)}/>`,
};
const ACC = {
  hair: `<path d="M-34 -306 Q-30 -322 -20 -326 M-8 -315 Q-4 -334 8 -336 M18 -312 Q26 -326 36 -322" ${S(6)}/>`,
  sprout: `<path d="M0 -316 Q2 -334 8 -342" ${S(6)}/><path d="M8 -342 C 16 -372, 54 -376, 62 -364 C 56 -340, 28 -330, 8 -342 Z" fill="${BLUE}"/><path d="M6 -340 C -2 -364, -34 -366, -40 -356 C -34 -338, -12 -332, 6 -340 Z" fill="${BLUE}"/>`,
  mirror: `<circle cx="0" cy="-316" r="16" fill="#fff" ${S(5)}/><circle cx="0" cy="-316" r="6" fill="${BLUE}"/>`,
};
const PROPS = {
  phone: `<g transform="rotate(-6 0 -120)"><rect x="-30" y="-150" width="60" height="96" rx="13" fill="#fff" ${S(5)}/><rect x="-12" y="-141" width="24" height="5" rx="2.5" fill="${INK}"/><rect x="-18" y="-126" width="36" height="12" rx="6" fill="${BLUE}"/><rect x="-18" y="-106" width="26" height="10" rx="5" fill="${TINT}"/></g>`,
  phoneHigh: `<rect x="48" y="-372" width="44" height="72" rx="10" fill="#fff" ${S(5)}/><circle cx="70" cy="-358" r="5" fill="${BLUE}"/>`,
  card: '',
};
function limb(a, b, bend, k = 0.22) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / L * L * k * bend, cy = my + dx / L * L * k * bend;
  return `M${a[0].toFixed(1)} ${a[1].toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
}
const blendPose = (A, B, p) => ({ h: A.h.map((v, i) => [lerp(v[0], B.h[i][0], p), lerp(v[1], B.h[i][1], p)]), f: A.f.map((v, i) => [lerp(v[0], B.f[i][0], p), lerp(v[1], B.f[i][1], p)]), b: p < 0.5 ? A.b : B.b, prop: p < 0.5 ? A.prop : B.prop });
const TORSO = 'M-36 -160 Q-44 -120 -40 -84 Q-38 -66 -20 -66 H20 Q38 -66 40 -84 Q44 -120 36 -160 Q0 -174 -36 -160 Z';
// o: {x,y,s,t, pose:[[t,name]], face:[[t,name]], marks:[[t0,t1,name]], acc, flip, look, hop:[t], shake:[t0,t1]}
function char(o) {
  return {
    m: `<g class="cb"><g class="lb"><path class="l0" ${S(36)}/><path class="l1" ${S(36)}/><path class="l2" ${S(36)}/><path class="l3" ${S(36)}/><path d="${TORSO}" fill="${INK}" stroke="${INK}" stroke-width="14" stroke-linejoin="round"/></g>
        <g class="lw"><path class="l0" ${S(22, '#fff')}/><path class="l1" ${S(22, '#fff')}/><path class="l2" ${S(22, '#fff')}/><path class="l3" ${S(22, '#fff')}/><path d="${TORSO}" fill="#fff"/></g>
        <g class="prop"></g>
        <g class="hd"><circle cx="0" cy="-238" r="78" fill="#fff" ${S(7)}/>${ACC[o.acc] || ''}<g class="fc" transform="translate(0 -238)"></g></g>
        <g class="mk"></g></g>`,
    t: o.t || 0, d: 0.45, a: 'pop', x: o.x, y: o.y ?? 600, s: o.s || 1, flip: o.flip,
    u(el, lt) {
      const pick = (arr, dflt) => { let cur = arr ? arr[0] : [0, dflt], prev = cur; (arr || []).forEach(e => { if (lt >= e[0]) { prev = cur; cur = e; } }); return [prev, cur]; };
      // pose blend
      const [pp, pc] = pick(o.pose, 'stand'), k = io(clamp((lt - pc[0]) / 0.32)), P = blendPose(POSES[pp[1]], POSES[pc[1]], pp === pc ? 1 : k);
      const breathe = Math.sin(lt * 2.4) * 3, sway = Math.sin(lt * 1.7) * 3;
      const hands = P.h.map((h, i) => [h[0] + (i ? sway : -sway) * 0.6, h[1] + breathe]);
      const ds = [limb(SH[0], hands[0], P.b[0]), limb(SH[1], hands[1], P.b[1]), limb(HP[0], P.f[0], 0.15, 0.1), limb(HP[1], P.f[1], -0.15, 0.1)];
      el.querySelectorAll('.l0').forEach(p => p.setAttribute('d', ds[0])); el.querySelectorAll('.l1').forEach(p => p.setAttribute('d', ds[1]));
      el.querySelectorAll('.l2').forEach(p => p.setAttribute('d', ds[2])); el.querySelectorAll('.l3').forEach(p => p.setAttribute('d', ds[3]));
      const pr = el.querySelector('.prop'); const pk = P.prop || ''; if (pr._k !== pk) { pr.innerHTML = PROPS[pk] || (pk === 'card' && o.card ? o.card : ''); pr._k = pk; }
      // face
      const [, fc] = pick(o.face, 'neutral'), F = FACES[fc[1]], fg = el.querySelector('.fc');
      if (fg._k !== fc[1]) {
        fg._k = fc[1];
        fg.innerHTML = eyesSvg(F.eyes) + (F.brows ? `<path d="${F.brows[0]}" ${S(5)}/><path d="${F.brows[1]}" ${S(5)}/>` : '') +
          `<path d="${F.mouth}" ${F.mfill ? `fill="${INK}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"` : S(5)}/>` +
          (F.blush ? `<path d="M-60 28 l-8 10 M-50 28 l-8 10 M-40 28 l-8 10 M48 28 l-8 10 M58 28 l-8 10 M68 28 l-8 10" ${S(3.5, BLUE)}/>` : '');
        const pf = clamp((lt - fc[0]) / 0.15); fg._t = fc[0];
      }
      const fp = io(clamp((lt - fg._t) / 0.18)); fg.setAttribute('transform', `translate(${(o.look || 0)} ${-238 + (1 - fp) * 3}) scale(${(0.94 + 0.06 * fp).toFixed(3)})`);
      const bl = fg.querySelector('.blink'); if (bl) { const ph = (lt + (o.blink || 0.7)) % 3.1, b = ph < 0.08 ? 1 - ph / 0.08 : ph < 0.16 ? (ph - 0.08) / 0.08 : 1; bl.setAttribute('transform', `translate(0 6) scale(1 ${(0.12 + 0.88 * b).toFixed(3)}) translate(0 -6)`); }
      // marks
      const mk = el.querySelector('.mk'), on = (o.marks || []).filter(m => lt >= m[0] && lt < m[1]);
      const key = on.map(m => m[2]).join(','); if (mk._k !== key) { mk.innerHTML = on.map(m => `<g data-m="${m[0]}">${MARKS[m[2]]}</g>`).join(''); mk._k = key; }
      mk.querySelectorAll('[data-m]').forEach(g => { const q = clamp((lt - +g.dataset.m) / 0.3); g.style.transformBox = 'fill-box'; g.style.transformOrigin = 'center'; g.style.transform = `scale(${pop(q).toFixed(3)}) translateY(${(Math.sin(lt * 4) * 3).toFixed(2)}px)`; g.style.opacity = io(clamp(q * 2)); });
      // body motion
      let dy = 0, rot = 0, sx = 1;
      (o.hop || []).forEach(h0 => { const q = (lt - h0) / 0.45; if (q > 0 && q < 1) dy -= Math.sin(q * Math.PI) * 34; });
      if (o.shake && lt > o.shake[0] && lt < o.shake[1]) rot = Math.sin((lt - o.shake[0]) * 22) * 5;
      if (pc[1] === 'cheer') dy -= Math.abs(Math.sin(lt * 5.5)) * 14;
      if (pc[1] === 'sleep' || pc[1] === 'think') rot += -4;
      if (o.flip) sx = -1;
      el.querySelector('.hd').setAttribute('transform', `rotate(${(rot + Math.sin(lt * 1.3) * 1.5).toFixed(2)} 0 -170)`);
      el.querySelector('.cb').setAttribute('transform', `translate(0 ${dy.toFixed(2)}) scale(${sx} 1)`);
      el.querySelector('.mk').setAttribute('transform', `scale(${sx} 1)`);
    },
  };
}

// ================= scenes =================
// every scene function gets w = local start times of its spoken words
const JAVI = { acc: 'hair' }, FOLIA = { acc: 'sprout' };
const R5 = [
  w => [
    { m: `<path d="M846 112 a58 58 0 1 0 50 88 a46 46 0 1 1 -50 -88 Z" fill="${BLUE}"/>` + star(740, 120, 12, INK) + star(960, 260, 9, INK) + star(700, 230, 7), t: 0, d: 0.5, a: 'pop' },
    char({ ...JAVI, x: 420, s: 1.3, pose: [[0, 'phone']], face: [[0, 'tired']], marks: [[0.2, 99, 'glow']] }),
    { m: pill(800, 360, '23:47', { size: 34 }), t: 0.35, d: 0.4, a: 'pop' },
  ],
  w => [
    char({ ...JAVI, x: 360, s: 1.3, pose: [[0, 'selfie']], face: [[0, 'worried'], [w[7] - 0.1, 'annoyed']], marks: [[w[7], 99, 'sweat']] }),
    { m: card(640, 90, 300, 300) + `<circle cx="790" cy="240" r="96" fill="#fff" ${S(5)}/>` + Array.from({ length: 18 }, (_, i) => { const a = i / 18 * Math.PI * 2; return `<path d="M${790 + Math.cos(a) * 92} ${240 + Math.sin(a) * 92} L${790 + Math.cos(a) * 72} ${240 + Math.sin(a) * 72}" ${S(5)}/>`; }).join('') + `<circle cx="790" cy="240" r="46" fill="${BLUE}" opacity="0.18"/><circle cx="790" cy="240" r="46" fill="none" stroke="${BLUE}" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>`, t: w[5] - 0.2, d: 0.45, a: 'pop' },
  ],
  w => [
    char({ ...JAVI, x: 280, s: 1.25, pose: [[0, 'phone']], face: [[0, 'neutral'], [w[6], 'worried']] }),
    { m: bub(1000, 150, 'Hola, ¿cuánto cuesta\nun injerto?', { side: 'out', size: 38 }), t: w[6] - 0.1, d: 0.45, a: 'pop' },
    { m: T(1000, 320, 26, 'Enviado · 23:49', { a: 'end', c: MUTE, w: 500 }), t: w[6] + 0.6, d: 0.4, a: 'fade' },
  ],

    if (opt.full ? i !== 0 : vis <= 0.001) { Sx.div.style.display = 'none'; return; }
    Sx.div.style.display = ''; Sx.div.style.opacity = opt.full ? 1 : vis;
    Sx.div.style.filter = vis < 0.999 && !opt.full ? `blur(${((1 - vis) * 10).toFixed(2)}px)` : 'none';
    const p = clamp(lt / dur), z = i % 2 === 0 ? lerp(1.0, 1.035, io(p)) : lerp(1.035, 1.0, io(p));
    Sx.svg.style.transform = `scale(${z.toFixed(4)})`;
    Sx.title.forEach((w, k) => { const q = opt.full ? 1 : io(clamp((lt - 0.02 - k * 0.07) / 0.4)); w.style.opacity = q; w.style.filter = q < 1 ? `blur(${((1 - q) * 12).toFixed(2)}px)` : 'none'; w.style.transform = `translateY(${((1 - q) * 18).toFixed(2)}px)`; });
    Sx.els.forEach(e => animEl(e, opt.full ? Math.max(lt, opt.ft || lt) : lt));
  });
  const box = document.getElementById('sub');
  const c = opt.nosub ? null : REEL.chunks.find(c => t >= c.start - 0.05 && t < c.end);
  if (!c) { box.style.opacity = 0; return; }
  if (box._k !== c.start) { box.innerHTML = c.words.map(w => `<span>${w.w}</span>`).join(''); box._k = c.start; }
  box.style.opacity = io(clamp((t - c.start + 0.05) / 0.15));
  [...box.children].forEach((sp, i) => { const q = io(clamp((t - c.words[i].t + 0.04) / 0.14)); sp.style.color = `rgba(29,31,32,${(0.22 + 0.78 * q).toFixed(3)})`; });
};

window.check = () => {
  const bad = [];
  scenes.forEach((Sx, i) => {
    if (Sx.div.style.display === 'none') return;
    const tr = Sx.title.map(s => s.getBoundingClientRect()).filter(r => r.width);
    if (tr.length) { const top = Math.min(...tr.map(r => r.top)), bot = Math.max(...tr.map(r => r.bottom)); if (top < 290 || bot > 570) bad.push(`s${i + 1}:title`); }
    const r = Sx.root.getBoundingClientRect(); if (r.width && (r.top < 590 || r.bottom > 1290 || r.left < 30 || r.right > 1050)) bad.push(`s${i + 1}:art(${r.left | 0},${r.top | 0},${r.right | 0},${r.bottom | 0})`);
  });
  const sb = [...document.querySelectorAll('#sub span')].map(s => s.getBoundingClientRect());
  if (sb.length) { const top = Math.min(...sb.map(r => r.top)), bot = Math.max(...sb.map(r => r.bottom)); if (top < 1320 || bot > 1515) bad.push(`sub(${top | 0}-${bot | 0})`); }
  return bad;
};
</script>
