<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacientes que se escapan</title>
<style>
  @font-face { font-family: "InterX"; src: url("assets/fonts/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "InterX"; src: url("assets/fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "InterX"; src: url("assets/fonts/Inter-Bold.otf"); font-weight: 700; }
  html, body { margin:0; padding:0; background:#0A0A0A; overflow:hidden; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; background:#0A0A0A; }
  #cv { position:absolute; inset:0; width:1080px; height:1920px; display:block; }
  .pre { position:absolute; left:-9999px; font-family:"InterX"; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="39.8" data-start="0">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <span class="pre" style="font-weight:500">¿Sabes? á</span><span class="pre" style="font-weight:600">¿Sabes? á</span><span class="pre" style="font-weight:700">TU CLÍNICA €</span>
</div>
<script src="assets/gsap.min.js"></script>
<script src="assets/words.js"></script>
<script src="assets/cues.js"></script>
<script src="assets/clips.js"></script>
<script src="assets/main.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const clock = { v: 0 };
  tl.to(clock, { v: 1, duration: 39.8, ease: "none", onUpdate: () => window.__render(tl.time()) }, 0);
  window.__timelines["main"] = tl;
  document.fonts.ready.then(() => window.__render(0));
</script>
</body>
</html>
