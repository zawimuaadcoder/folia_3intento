<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<div class="sc" id="A"><div class="kt" id="kA"><div class="dl vl" style="left:72px"></div><div class="dl vl" style="left:1008px"></div></div></div>
<div class="sc" id="B"><div class="kt" id="kB"><div class="dl vl" style="left:72px"></div><div class="dl vl" style="left:1008px"></div></div></div>
<div class="sc dk black" id="C"><div class="kt" id="kC"><div class="dl hl" style="top:600px"></div><div class="dl hl" style="top:1160px"></div></div></div>
<div class="sc" id="D"><div class="kt" id="kD"><div class="dl vl" style="left:72px"></div><div class="dl vl" style="left:1008px"></div></div></div>
<!-- E · the report, measured (pin: redline) -->
<div class="sc" id="E"><div class="st" data-z="2.0" data-dark="1">{{C:Redline}}</div></div>
<!-- G · vanity metrics (pin: wallet pills) -->
<div class="sc" id="G"><div class="st" data-z="2.2" data-dark="1">{{C:Pills}}</div></div>
<div class="sc" id="H"><div class="kt" id="kH"><div class="dl vl" style="left:72px"></div><div class="dl vl" style="left:1008px"></div></div></div>
<div class="sc dk black" id="I"><div class="kt" id="kI"><div class="dl hl" style="top:600px"></div><div class="dl hl" style="top:1160px"></div></div></div>
<!-- J · what to measure (pin: toolbar + Ask AI) -->
<div class="sc" id="J"><div class="st" data-z="1.85">{{C:Toolbar}}</div></div>
<div class="sc dk blue" id="K"><div class="kt" id="kK"><div class="dl hl" style="top:600px"></div><div class="dl hl" style="top:1160px"></div></div></div>
<div id="sub"></div>
<script src="engine.js"></script>
<script>
const L = (a, b) => Array.from({ length: b - a + 1 }, (_, k) => [w(a + k), W[a + k].w]);
window.setup = function (meta) {
  W = meta.words; TOTAL = meta.total; buildSubs(); const c = i => w(i) - .12;
  SC = [['A', 0, c(13), 0], ['B', c(13), c(19), 0], ['C', c(19), c(31), 0], ['D', c(31), c(44), 0], ['E', c(44), c(63), 1], ['G', c(63), c(72), 1],
  ['H', c(72), c(93), 0], ['I', c(93), c(101), 0], ['J', c(101), c(106), 1], ['K', c(106), TOTAL + 1, 0]];
};
HOOKS.A = t => {
  line($('kA'), 'a1', t, L(0, 5), 58, 600, { w: 600 }); rise($('kA'), 'a2', t, w(11) - .05, '3 €', 300, 700);
  line($('kA'), 'a3', t, [[w(6), 'por', '#8A8A8E'], [w(7), 'contacto', '#3B87F2']], 70, 1070, { w: 600 });
};
HOOKS.B = t => {
  line($('kB'), 'b1', t, [[w(13), 'Y', '#8A8A8E'], [w(14), 'tú', '#8A8A8E'], [w(15), 'piensas:', '#8A8A8E']], 66, 650, { w: 600 });
  letters($('kB'), 'b2', t, w(16), 'qué bien,', 100, 760); echo($('kB'), 'b3', t, w(18) - .05, 'baratísimos.', 130, 880);
};
HOOKS.C = t => { rise($('kC'), 'c1', t, w(19), 'Pero te voy a decir algo', 66, 700); rise($('kC'), 'c2', t, w(25), 'que a lo mejor', 66, 810); letters($('kC'), 'c3', t, w(29), 'no esperas.', 130, 920, { color: '#3B87F2', wave: 1 }) };
HOOKS.D = t => {
  swap($('kD'), 'd1', t, [[w(31), 'Un contacto barato'], [w(34), 'no paga la nómina.']], 88, 700, { end: w(39) - .1 });
  line($('kD'), 'd2', t, L(39, 41), 70, 740, { w: 600 }); letters($('kD'), 'd3', t, w(42), 'una cita.', 170, 850, { color: '#3B87F2', wave: 1 });
};
// E — 100 contacts, 2 visits: the 3 € contact really cost 150 €
HOOKS.E = (t, a) => {
  popIn($('rl'), t, a, { d: .65, s: .9, dy: 50 }); const tags = [...document.querySelectorAll('.rt')];
  popIn(tags[0], t, a + .3, { s: .4, dy: 0 }); popIn(tags[1], t, w(61), { s: .4, dy: 0 }); popIn($('rlQ'), t, a + .35, { s: .9, dy: 10 });
  popIn($('rlN'), t, w(46), { s: .97, dy: 10 }); popIn($('rlC'), t, w(58) - .1, { d: .55, s: .85, dy: 20 });
  $('rlCv').textContent = Math.round(lerp(3, 150, io(p(t, w(61) - .1, .9)))) + ' €';
  const g = Math.sin(Math.PI * p(t, w(62), .5)); $('rlC').style.boxShadow = `0 0 0 ${2 * g}px rgba(59,135,242,.8), 0 0 ${30 * g}px rgba(59,135,242,${.4 * g})`;
};
// G — clicks, contacts, followers light up… appointments stay at 2
HOOKS.G = (t, a) => {
  const rows = [...document.querySelectorAll('#pl .pp')]; rows.forEach((r, i) => popIn(r.firstChild, t, a + .15 + i * .07, { s: .8, dy: 0, dx: 20 }));
  const ts = [w(69), w(70), w(71), w(71) + .7]; rows.forEach((r, i) => popIn(r.lastChild, t, ts[i] - .1, { s: .3, dy: 0, dx: -20 }));
  const c = rows[3].lastChild, k = Math.sin(Math.PI * cl(p(t, ts[3] + .3, .6))); c.style.boxShadow = `0 0 0 ${3 * k}px rgba(59,135,242,.7)`;
};
HOOKS.H = t => {
  const o1 = w(84) - .25; line($('kH'), 'h1', t, L(72, 76), 58, 680, { w: 600, out: o1 }); rise($('kH'), 'h2', t, w(77), 'por la gente que', 70, 780, { out: o1 });
  letters($('kH'), 'h3', t, w(81), 'mira la carta…', 100, 890, { out: o1 });
  rise($('kH'), 'h4', t, w(84) - .1, 'y no por la que', 70, 720); letters($('kH'), 'h5', t, w(89), 'se sienta a comer.', 92, 840, { color: '#3B87F2', wave: 1 });
};
HOOKS.I = t => {
  swap($('kI'), 'i1', t, [[w(93), 'Muchos contactos.'], [w(95), 'Poco control.']], 96, 760, { end: w(97) - .1 });
  letters($('kI'), 'i2', t, w(97), 'Y la misma agenda.', 98, 800, { blueFrom: 5 });
};
// J — switch the metric from contacts to appointments
HOOKS.J = (t, a) => {
  popIn($('tb'), t, a, { d: .6, s: .92, dy: 30 }); popIn($('tb2'), t, a + .15, { d: .6, s: .92, dx: 80, dy: 0 }); popIn($('tbTip'), t, a + .3, { s: .8, dy: 10 });
  const o = [...document.querySelectorAll('#tbSeg .tbo')], x = [4, 100, 212], wd = [92, 108, 78], k1 = soft(p(t, w(102) - .1, .5)), k2 = soft(p(t, w(104) - .1, .5));
  const K = $('tbK'); K.style.left = (x[0] + (x[1] - x[0]) * k1 + (x[2] - x[1]) * k2) + 'px'; K.style.width = (wd[0] + (wd[1] - wd[0]) * k1 + (wd[2] - wd[1]) * k2) + 'px';
  const sel = t < w(104) - .1 ? (t < w(102) - .1 ? 0 : 1) : 2; o.forEach((e, i) => { e.style.color = i === sel ? '#1D1F20' : '#6E6E73'; e.style.fontWeight = i === sel && sel === 2 ? 600 : 400 });
  const cur = $('tbCur'); cur.style.left = lerp(470, 396, io(p(t, a + .2, .5))) + 'px'; cur.style.top = lerp(330, 262, io(p(t, a + .2, .5))) + 'px';
  cur.style.transform = `scale(${1 - .12 * Math.sin(Math.PI * p(t, w(104) - .1, .2))})`;
  const g = Math.sin(Math.PI * p(t, w(105), .5)); $('tbAi').style.transform = `scale(${1 + .05 * g})`;
};
HOOKS.K = t => { line($('kK'), 'k1', t, L(106, 110), 60, 700, { w: 600 }); letters($('kK'), 'k2', t, w(112), 'Marketing Health', 118, 810); letters($('kK'), 'k3', t, w(114), 'for Clinics.', 118, 950) };
</script></body></html>
