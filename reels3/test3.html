function mk(host,words,size){if(host.dataset.ok)return [...host.children].slice(0,words.length);host.dataset.ok=1;host.innerHTML=words.map(w=>`<span class="kw" style="font-size:${size}px">${w}</span>`).join('');return [...host.children]}

      const n=$('n30'),k=out5(p(l,1.25,.4));n.textContent=Math.round(30*out(p(l,1.25,.8)));n.style.left=(540-n.offsetWidth/2)+'px';n.style.top='740px';n.style.opacity=k;n.style.filter=`blur(${(1-k)*18}px)`;n.style.transform=`scale(${lerp(.8,1,k)})`;

    labs.forEach((el,i)=>{const d=Math.abs(pos-i);el.style.color=d<.5?'#1D1F20':'#3A3B3D';el.style.fontWeight=d<.5?500:400})}
};
