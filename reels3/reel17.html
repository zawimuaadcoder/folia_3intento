  <div id="cpP" style="position: absolute; left: 30px; top: -40px; width: 640px; height: 460px; border-radius: 0 0 0 96px; background: linear-gradient(200deg, #A9C9FA 0%, #C6B9F2 55%, #E6DDF9 100%); box-shadow: 0 30px 60px -30px rgba(70,80,160,0.35)">
    <div style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(70% 60% at 20% 80%, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%)"></div>
  </div>
  <span id="cpDn" style="position: absolute; left: 488px; top: 60px; width: 68px; height: 68px; border-radius: 50%; background: rgba(255,255,255,0.45); box-shadow: 0 0 0 1px rgba(255,255,255,0.6) inset, 0 6px 16px -6px rgba(60,60,120,0.3); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#1D1F20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></span>
  <div id="cpIn" style="position: absolute; left: 72px; top: 210px; width: 560px; height: 104px; border-radius: 999px; background: rgba(255,255,255,0.78); box-shadow: 0 0 0 1px rgba(255,255,255,0.7) inset, 0 0 40px 6px rgba(150,170,250,0.45), 0 16px 30px -16px rgba(60,70,150,0.3); display: flex; align-items: center; gap: 18px; padding: 0 12px">
    <span style="width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 2px 8px rgba(60,60,120,0.12); display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#1D1F20" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
    <span id="cpTx" style="font-size: 34px; letter-spacing: -0.035em; white-space: nowrap">¿Cuánto cuesta el inj<span id="cpCur" style="display: inline-block; width: 3px; height: 40px; margin-left: 2px; vertical-align: -8px; background: #1D1F20"></span></span>
  </div>

</div>

  <div id="sgT" style="position: absolute; left: 60px; top: 190px; width: 480px; height: 130px; border-radius: 999px; background: #F2F2F4; box-shadow: 0 0 0 1px rgba(255,255,255,0.95) inset, 0 1px 0 rgba(255,255,255,1), 0 18px 40px -20px rgba(29,31,32,0.25)">
    <div id="sgK" style="position: absolute; left: 14px; top: 13px; width: 214px; height: 104px; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(238,239,243,0.8) 55%, rgba(225,227,234,0.92) 100%); box-shadow: 0 0 0 1.5px rgba(255,255,255,1) inset, 0 -1px 0 1px rgba(59,135,242,0.28), 0 0 0 5px #F7F7F8, 0 0 0 6px rgba(29,31,32,0.07), 0 10px 22px -8px rgba(29,31,32,0.28), 0 -3px 14px -2px rgba(130,110,255,0.3)">
      <div style="position: absolute; left: 16%; right: 16%; top: 6px; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,1), rgba(255,255,255,0))"></div>
    </div>
    <span class="sgL" style="position: absolute; left: 14px; top: 13px; width: 214px; height: 104px; display: flex; align-items: center; justify-content: center; font-size: 36px; letter-spacing: -0.02em">5 min</span>
    <span class="sgL" style="position: absolute; left: 252px; top: 13px; width: 214px; height: 104px; display: flex; align-items: center; justify-content: center; font-size: 36px; letter-spacing: -0.02em; color: #3A3B3D">3 h</span>
  </div>
  <div id="sgC" style="position: absolute; left: 0; right: 0; top: 360px; text-align: center; font-size: 22px; color: #6E6E73">Tiempo de respuesta</div>
</div>

<div class="sc" id="G"><div class="st" data-z="2.1"><div style="width: 600px; height: 600px; background: #F4F4F7; font-family: Inter, sans-serif; color: #1D1F20; position: relative; overflow: hidden">
  <div id="whW" style="position: absolute; left: 0; top: 0; width: 600px; height: 600px">
    <span class="wh" style="position: absolute; left: 150px; top: 150px; font-size: 30px; letter-spacing: -0.01em; color: #B2B2B8; transform: rotate(-16deg); transform-origin: left center; filter: blur(0.8px)">Cierra la app</span>
    <span class="wh" style="position: absolute; left: 160px; top: 212px; font-size: 30px; letter-spacing: -0.01em; color: #A2A2A8; transform: rotate(-6deg); transform-origin: left center">Ve otra clínica</span>
    <span class="wh" style="position: absolute; left: 160px; top: 352px; font-size: 30px; letter-spacing: -0.01em; color: #A2A2A8; transform: rotate(6deg); transform-origin: left center">Ve otra más</span>
    <span class="wh" style="position: absolute; left: 150px; top: 414px; font-size: 30px; letter-spacing: -0.01em; color: #B2B2B8; transform: rotate(16deg); transform-origin: left center; filter: blur(0.8px)">Se olvida de ti</span>
  </div>
  <div id="whP" style="position: absolute; left: 110px; top: 256px; width: 380px; height: 88px; border-radius: 999px; background: linear-gradient(90deg, #FFFFFF 60%, rgba(255,255,255,0.85)); box-shadow: 0 0 0 1px rgba(29,31,32,0.05), 0 14px 34px -14px rgba(29,31,32,0.22); display: flex; align-items: center; gap: 22px; padding: 0 16px; box-sizing: border-box">
    <span id="whB" style="width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #DCE8FF 0%, #8FB6F7 45%, #3B87F2 100%); box-shadow: 0 0 18px 4px rgba(59,135,242,0.35); display: flex; align-items: center; justify-content: center; gap: 9px; flex: none"><i style="width: 9px; height: 13px; border-radius: 5px; background: #FFFFFF"></i><i style="width: 9px; height: 13px; border-radius: 5px; background: #FFFFFF"></i></span>
    <span id="whL" style="font-size: 32px; letter-spacing: -0.02em">3 horas después</span>
  </div>
</div>
</div></div>
<!-- H · live message (pin: Live Transcribe) -->
<div class="sc" id="H"><div class="st" data-z="1.8"><div style="width: 600px; height: 600px; background: #F1F1F1; font-family: Inter, sans-serif; color: #1D1F20; position: relative; overflow: hidden">
  <div id="lv" style="position: absolute; left: 130px; top: 200px; width: 340px; height: 168px; border-radius: 22px; background: linear-gradient(180deg, #2A2A2C, #1C1C1E); box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 20px 40px -18px rgba(0,0,0,0.45); padding: 20px 20px 0; box-sizing: border-box">
    <div id="lvTx" style="font-size: 17px; line-height: 1.38; font-weight: 500; color: #FFFFFF; letter-spacing: -0.005em">Gracias por todo, pero al final he reservado en otra clínica.</div>
    <div style="position: absolute; left: 20px; right: 16px; bottom: 16px; display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: #E5E5EA"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#E5E5EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H9l-4 4z"></path></svg>Laura M. · 14:12</span>
      <span id="lvSt" style="width: 36px; height: 36px; border-radius: 50%; background: #3B87F2; box-shadow: 0 0 0 4px rgba(59,135,242,0.25); display: flex; align-items: center; justify-content: center"><i style="width: 12px; height: 12px; border-radius: 3px; background: #1C1C1E"></i></span>
    </div>
  </div>
  <div id="lvC" style="position: absolute; left: 0; right: 0; top: 384px; text-align: center; font-size: 15px; font-weight: 500; color: #3A3B3D">Mensaje nuevo</div>
  <div style="position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; justify-content: space-between; font-size: 11px; color: #6E6E73; line-height: 1.3"><span>Bandeja<br>WhatsApp</span><span style="text-align: right">Hace 3 h<br>Sin responder</span></div>
</div>
</div></div>
<div class="sc dk black" id="I"><div class="kt" id="kI"><div class="dl hl" style="top:600px"></div><div class="dl hl" style="top:1160px"></div></div></div>
<div class="sc" id="J"><div class="kt" id="kJ"><div class="dl vl" style="left:72px"></div><div class="dl vl" style="left:1008px"></div></div></div>
<div class="sc dk blue" id="K"><div class="kt" id="kK"><div class="dl hl" style="top:600px"></div><div class="dl hl" style="top:1160px"></div></div></div>
<div id="sub"></div>
<script src="engine.js"></script>
<script>
const MSG = 'Hola, ¿cuánto cuesta el injerto?';
const WH = ['3 horas después', 'Cierra la app', 'Ve otra clínica', 'Ve otra más', 'Se olvida de ti'];
const LIVE = 'Gracias por todo, pero al final he reservado en otra clínica.';
window.setup = function (meta) {
  W = meta.words; TOTAL = meta.total; buildSubs(); const c = i => w(i) - .12;
  SC = [['A', 0, c(at('un')), 0], ['B', c(at('un')), c(at('y', 2)), 1], ['C', c(at('y', 2)), c(at('porque')), 0], ['D', c(at('porque')), c(at('los')), 0],
  ['E', c(at('los')), c(at('en', 2)), 0], ['F', c(at('en', 2)), c(at('ya')), 1], ['G', c(at('ya')), c(at('pagas')), 1], ['H', c(at('pagas')), c(at('es')), 1],
  ['I', c(at('es')), c(at('mismo')), 0], ['J', c(at('mismo')), c(at('eso')), 0], ['K', c(at('eso')), TOTAL + 1, 0]];
  // composer: a real input — text scrolls inside a fixed field, placeholder until the patient types
  const tx = $('cpTx'); tx.innerHTML = '<span id="cpIn2" style="display:inline-block"></span>' + tx.querySelector('#cpCur').outerHTML;
  tx.style.cssText += ';overflow:hidden;width:400px;display:flex;align-items:center';
  // wheel: one span per item, placed on the arc each frame
  $('whW').innerHTML = WH.map(x => `<span class="wh" style="position:absolute;left:160px;font-size:30px;letter-spacing:-0.01em;color:#A2A2A8;transform-origin:left center;white-space:nowrap">${x}</span>`).join('');
  $('whL').innerHTML = WH.map(x => `<span style="position:absolute;white-space:nowrap">${x}</span>`).join(''); $('whL').style.position = 'relative'; $('whL').style.height = '40px'; $('whL').style.flex = '1';
  $('lvTx').innerHTML = LIVE.split(' ').map(x => `<span style="display:inline-block;margin-right:.26em">${x}</span>`).join('');
};
HOOKS.A = t => {
  line($('kA'), 'a1', t, [[T('son'), 'Son', '#8A8A8E'], [T('las'), 'las', '#8A8A8E']], 70, 600, { w: 600 });
  rise($('kA'), 'a2', t, T('once') - .05, '11:00', 280, 700);
  line($('kA'), 'a3', t, [[T('de'), 'de', '#8A8A8E'], [T('la'), 'la', '#8A8A8E'], [T('mañana.'), 'mañana.', '#3B87F2']], 70, 1060, { w: 600 });
};
HOOKS.B = (t, a) => {
  $('cpP').style.transform = `translateY(${(1 - soft(p(t, a, .7))) * -320}px)`; popIn($('cpIn'), t, a + .25, { d: .6, s: .9, dy: 30 }); popIn($('cpDn'), t, a + .4, { s: .5, dy: 0 });
  const n = Math.round(MSG.length * cl(p(t, T('hola,') - .1, T('injerto?') - T('hola,') + .45))), s = $('cpIn2');
  s.textContent = n ? MSG.slice(0, n) : 'Escribe un mensaje…'; s.style.color = n ? '#1D1F20' : '#8A8A8E';
  s.style.transform = `translateX(${-Math.max(0, s.offsetWidth - 385)}px)`; $('cpCur').style.opacity = (Math.floor(t * 2.2) % 2 === 0 || (n > 0 && n < MSG.length)) ? 1 : 0;
  const pr = Math.sin(Math.PI * p(t, T('enviar'), .3)); $('cpDn').style.transform += ` scale(${1 - .12 * pr})`; $('cpDn').style.background = `rgba(255,255,255,${.45 + .4 * pr})`;
  const g = Math.sin(Math.PI * p(t, T('injerto?') + .3, .7)); $('cpIn').style.boxShadow = `0 0 0 1px rgba(255,255,255,.7) inset, 0 0 ${40 + 30 * g}px ${6 + 8 * g}px rgba(150,170,250,${.45 + .3 * g}), 0 16px 30px -16px rgba(60,70,150,.3)`;
};
HOOKS.C = t => {
  swap($('kC'), 'c1', t, [[T('y', 2), 'Y aquí'], [T('empieza'), 'empieza todo.']], 130, 780, { end: T('o') - .5 });
  dots($('kC'), 'cd', t, T('todo.') + .35, T('o') + .05, 860, '#fff');
  letters($('kC'), 'c2', t, T('o'), 'O se acaba.', 150, 800, { color: '#3B87F2', wave: 1 });
};
HOOKS.D = t => {
  const i = at('porque');
  line($('kD'), 'd1', t, [[w(i), 'Porque'], [w(i + 1), 'te'], [w(i + 2), 'voy'], [w(i + 3), 'a'], [w(i + 4), 'decir'], [w(i + 5), 'algo']], 64, 680, { w: 600 });
  line($('kD'), 'd2', t, [[w(i + 6), 'que'], [w(i + 7), 'a'], [w(i + 8), 'lo'], [w(i + 9), 'mejor']], 64, 780, { w: 600 });
  letters($('kD'), 'd3', t, T('no') - .05, 'no esperas.', 130, 900, { color: '#3B87F2', wave: 1 });
};
HOOKS.E = t => {
  line($('kE'), 'e1', t, [[T('los'), 'Los'], [T('primeros'), 'primeros']], 66, 620, { w: 600 });
  echo($('kE'), 'e2', t, T('cinco') - .05, '5 minutos', 190, 740, { trail: 'rgba(255,255,255,.55)' });
  const i = at('valen'); line($('kE'), 'e3', t, [[w(i), 'valen'], [w(i + 1), 'más'], [w(i + 2), 'que'], [w(i + 3), 'todo'], [T('anuncio.'), 'el anuncio.']], 60, 1000, { w: 600 });
};
// F — still at 5 min… then the liquid knob slides to 3 h
HOOKS.F = (t, a) => {
  popIn($('sgT'), t, a, { d: .6, s: .9, dy: 40 }); const k = soft(p(t, T('tres') - .1, .7)), v = Math.sin(Math.PI * cl(p(t, T('tres') - .1, .45)));
  const K = $('sgK'); K.style.left = lerp(14, 252, k) + 'px'; K.style.width = (214 + v * 40) + 'px'; K.style.marginLeft = (-v * 20) + 'px'; K.style.transform = `scaleY(${1 - .06 * v})`;
  const L = [...document.querySelectorAll('#sgT .sgL')]; L[0].style.color = mix('#1D1F20', '#3A3B3D', k); L[1].style.color = mix('#3A3B3D', '#1D1F20', k);
  L[0].style.fontWeight = k < .5 ? 500 : 400; L[1].style.fontWeight = k < .5 ? 400 : 500;
  const caps = [[a, 'Tiempo de respuesta'], [T('móvil') - .1, 'Móvil en la mano'], [T('ganas.') - .15, 'Con ganas'], [T('fresca.') - .25, 'Con la duda fresca'], [T('tres') - .1, '3 horas después']];
  let cur = caps[0]; caps.forEach(x => { if (t >= x[0]) cur = x }); const cp = $('sgC'); cp.textContent = cur[1]; popIn(cp, t, cur[0], { s: .9, dy: 12, d: .45 }); cp.style.color = cur[1] === 'Tiempo de respuesta' ? '' : '#1D1F20';
};
// G — the wheel turns through what happens in those 3 hours
HOOKS.G = (t, a) => {
  popIn($('whP'), t, a, { d: .55, s: .9, dy: 0 }); const ts = [T('cerrado'), T('visto'), T('dos'), T('olvidado')];
  const f = ts.reduce((s, x) => s + soft(p(t, x - .15, .5)), 0);
  [...$('whW').children].forEach((el, i) => {
    const o = i - f, ao = Math.abs(o), e = out5(p(t, a + .1 + i * .05, .4));
    el.style.top = (300 - 20 + o * 66 + Math.sign(o) * 24) + 'px'; el.style.transform = `rotate(${o * 8}deg)`; el.style.left = (160 - Math.min(ao, 2.5) * 6) + 'px';
    el.style.opacity = e * (ao < .5 ? 0 : Math.max(0, 1 - (ao - .5) * .35)); el.style.filter = `blur(${Math.max(0, ao - 1.5) * 1.2}px)`; el.style.color = ao > 1.5 ? '#B2B2B8' : '#A2A2A8'
  });
  [...$('whL').children].forEach((el, i) => { const d = i - f, ad = Math.abs(d); el.style.top = (2 + d * 34) + 'px'; el.style.opacity = Math.max(0, 1 - ad * 1.6); el.style.filter = `blur(${ad * 6}px)` });
  $('whB').style.transform = `scale(${1 + .1 * Math.sin(t * 3)}) rotate(${f * 40}deg)`;
};
// H — the patient's last message arrives
HOOKS.H = (t, a) => {
  popIn($('lv'), t, a, { d: .6, s: .88, dy: 40 }); const ws = [...$('lvTx').children], n = ws.length;
  ws.forEach((s, i) => { const k = out5(p(t, a + .35 + i * .14, .3)); s.style.opacity = k * (i >= n - 2 ? lerp(1, .55, cl(p(t, a + .35 + (n + 2) * .14, .5))) : 1); s.style.filter = k < 1 ? `blur(${(1 - k) * 6}px)` : 'none' });
  const st = $('lvSt'), r = (t * 1.6) % 1; st.style.boxShadow = `0 0 0 ${4 + r * 10}px rgba(59,135,242,${.3 * (1 - r)})`;
  popIn($('lvC'), t, a + .3, { s: .9, dy: 8 });
};
HOOKS.I = t => {
  const o1 = T('no', 2) - .3;
  line($('kI'), 'i1', t, [[T('es'), 'Es'], [T('como'), 'como'], [T('invitar'), 'invitar']], 70, 700, { w: 600, out: o1 });
  letters($('kI'), 'i2', t, T('a', 4) - .05, 'a alguien a casa…', 96, 810, { wave: 1, out: o1 });
  rise($('kI'), 'i3', t, T('no', 2) - .1, 'y no abrirle', 70, 720);
  letters($('kI'), 'i4', t, T('la', 5), 'la puerta.', 150, 840, { color: '#3B87F2', wave: 1 });
};
HOOKS.J = t => {
  swap($('kJ'), 'j1', t, [[T('mismo'), 'Mismo anuncio.'], [T('mismo', 2), 'Mismo paciente.']], 104, 700, { end: T('y', 6) - .1 });
  line($('kJ'), 'j2', t, [[T('y', 6), 'y'], [T('una'), 'una'], [T('cita'), 'cita'], [T('que', 5), 'que'], [T('se', 3), 'se'], [T('va'), 'va']], 70, 760, { w: 600 });
  letters($('kJ'), 'j3', t, T('a', 6) - .05, 'a otra clínica.', 120, 880, { color: '#3B87F2' });
};
HOOKS.K = t => {
  const i = at('eso'); line($('kK'), 'k1', t, [[w(i), 'Eso'], [w(i + 1), 'es'], [w(i + 2), 'lo'], [w(i + 3), 'que'], [w(i + 4), 'arreglamos']], 60, 700, { w: 600 });
  letters($('kK'), 'k2', t, T('marketing'), 'Marketing Health', 118, 810); letters($('kK'), 'k3', t, T('for'), 'for Clinics.', 118, 950);
};
</script></body></html>
