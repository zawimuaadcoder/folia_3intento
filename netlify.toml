[build]
  command = "mkdir -p dist functions && cp index.html dist/index.html && cp -r assets dist/assets && cp api.mjs functions/api.mjs"
  publish = "dist"
  functions = "functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://calendly.com\")"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com; font-src 'self'; connect-src 'self' https://www.facebook.com https://connect.facebook.net; frame-src https://calendly.com https://*.calendly.com https://api.leadconnectorhq.com https://link.msgsndr.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
