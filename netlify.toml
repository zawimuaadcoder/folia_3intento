[build]
  command = "mkdir -p dist functions && cp index.html dist/index.html && cp api.mjs functions/api.mjs"
  publish = "dist"
  functions = "functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'sha256-V3BnFYATuGqBbcBWcmURkVWhIQSmIgq4vttrl+XYwes='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
